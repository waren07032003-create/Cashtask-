function mc(m,d){const left=m.sl-S.sb.filter(s=>s.m==m.id&&s.st!='Refusée').length;return `<div class="card"><div class="row"><b>${esc(m.t)}</b><span class="gr">${fmt(pay(m,d||0))}</span></div><div class="m">${esc(m.d)}</div><div class="row" style="margin-top:6px"><span><span class="tag">${m.cat}</span> ${m.vip?'<span class="tag wt">VIP</span>':''} <span class="m">${I('clock',13)} ${m.min} min · ${left} places · Preuve : ${m.pr}</span></span><button data-a="open" data-p="${m.id}">${t('do')}</button></div></div>`}
function missV(u){return `<h2>${t('missions')}</h2>`+S.m.filter(m=>!m.off).map(m=>mc(m,m.urg&&!m.vip)).join('')}
function doV(u){const m=S.m.find(x=>x.id==pick),s=S.sb.find(x=>x.u==u.id&&x.m==m.id);
return `<button class="o" data-a="go" data-p="missions">← Retour</button><div class="card"><h3>${esc(m.t)}</h3><div class="gr">${fmt(pay(m,m.urg&&!m.vip))}</div><ol>${m.st.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>${s?`<span class="tag ${s.st=='Validée'?'ok':s.st=='Refusée'?'no':'wt'}">${s.st}</span>${s.rs?`<p class="m">Motif : ${esc(s.rs)}</p>`:''}`:m.vip&&!u.vip?'<p>Mission réservée aux membres VIP.</p>':`<p class="m">Preuve demandée : ${m.pr}</p><input type="file" id="fl" accept="image/*"><div id="pv"></div><button data-a="send">Envoyer ma preuve</button>`}</div>`}
function refV(u){const l1=S.u.filter(x=>x.sp==u.id),l2=S.u.filter(x=>l1.some(a=>a.id==x.sp)),l3=S.u.filter(x=>l2.some(a=>a.id==x.sp));
const g=n=>S.tx.filter(x=>x.u==u.id&&x.type=='Parrainage N'+n).reduce((a,x)=>a+x.amt,0),msg=`Salut ! J’ai trouvé CASHTASK, une appli qui paie vraiment. Fais des petites missions, invite tes amis, retire sur MoMo. Inscris-toi avec mon lien, on gagne tous les deux 500F : ${link(u)}`,q=encodeURIComponent(msg);
return `<h2>${t('ref')}</h2><div class="card"><div class="m">Ton lien</div><b>${link(u)}</b><div class="m">Code : <b>${u.code}</b></div><div class="row" style="margin-top:8px"><button data-a="copy" data-p="${esc(link(u))}">Copier le lien</button><a class="btn s" target="_blank" href="https://wa.me/?text=${q}">WhatsApp</a><a class="btn s" target="_blank" href="https://t.me/share/url?url=${encodeURIComponent('https://'+link(u))}&text=${q}">Telegram</a><a class="btn s" target="_blank" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent('https://'+link(u))}">Facebook</a></div><p class="m">TikTok : copie le lien et colle-le dans ta bio.</p></div>
<div class="g3">${[[1,l1,'500 F + 10%'],[2,l2,'100 F + 3%'],[3,l3,'50 F + 1%']].map(([n,a,r])=>`<div class="card"><div class="m">Niveau ${n}</div><b>${a.length}</b><div class="gr">${fmt(g(n))}</div><div class="m">${r}</div></div>`).join('')}</div>
<h3>Mes filleuls</h3>${l1.map(x=>{const n=S.sb.filter(s=>s.u==x.id&&s.st=='Validée').length,gen=S.tx.filter(y=>y.u==u.id&&y.type=='Parrainage N1'&&y.note==x.id).reduce((a,y)=>a+y.amt,0);return `<div class="card row"><span>${esc(x.nm)}<br><span class="m">${x.d} · ${n} missions</span></span><b class="gr">${fmt(gen)}</b></div>`}).join('')||'<p class="m">Aucun filleul pour l’instant.</p>'}`}
function walV(u){const out=S.tx.filter(x=>x.u==u.id&&x.type=='Retrait').reduce((a,x)=>a-x.amt,0);
return `<h2>${t('wallet')}</h2><div class="hero"><div>Solde disponible</div><b>${fmt(u.bal)}</b><div class="m" style="color:#fff">Gagné : ${fmt(earned(u))} · Retiré : ${fmt(out)}</div></div><div class="card"><h3>Retirer (min. 1 000 FCFA)</h3><input id="am" type="number" inputmode="numeric" placeholder="Montant en FCFA"><select id="mt"><option>MTN MoMo</option><option>Moov Money</option><option>Orange Money</option><option>Wave</option><option>Airtel Money</option></select><input id="mn" inputmode="tel" value="${esc(u.ph)}"><button data-a="wd">Demander le retrait</button></div>
<h3>Historique</h3>${S.tx.filter(x=>x.u==u.id).slice().reverse().map(x=>`<div class="card row"><span>${x.type}<br><span class="m">${x.d}</span></span><span><b class="${x.amt<0?'':'gr'}">${x.amt>0?'+':''}${fmt(x.amt)}</b><br><span class="tag ${x.st=='Validé'?'ok':x.st=='Refusé'?'no':'wt'}">${x.st}</span></span></div>`).join('')}`}
function vipV(u){const on=u.vip&&u.vip>=today();return `<h2>${I('star',22)} Pack VIP · 1 000 FCFA / mois</h2><div class="card"><span class="tag ${on?'ok':''}">${on?'Actif jusqu’au '+u.vip:'Inactif'}</span><ul><li>Missions VIP qui paient 2 fois plus</li><li>Retraits prioritaires en moins de 2 h</li><li>Badge Or sur le profil</li><li>Missions en avant-première</li></ul><button data-a="vip">${on?'Prolonger':'Activer VIP'} (1 000 F)</button><p class="m">Paiement débité du solde (démo). En production : paiement Mobile Money.</p></div>`}
function meV(u){return `<h2>${t('me')}</h2><div class="card"><input id="nm" value="${esc(u.nm)}"><input id="ph" value="${esc(u.ph)}"><select id="cy">${Object.entries(C).map(([k,c])=>`<option value="${k}" ${u.c==k?'selected':''}>${c[0]}</option>`).join('')}</select><select id="lg"><option value="fr">Français</option><option value="en" ${S.lang=='en'?'selected':''}>English</option></select><label><input type="checkbox" id="nf" ${u.nf!==0?'checked':''} style="width:auto"> Notifications</label><br><button data-a="saveme">Enregistrer</button></div><div class="card">Code parrain : <b>${u.code}</b> · Niveau : <b>${lvl(u)}</b></div><div class="row"><a class="btn s" target="_blank" href="https://wa.me/22900000000">Support WhatsApp</a><button class="r" data-a="out">Déconnexion</button></div><p><button class="o" data-a="adm">${adm?'Quitter':'Ouvrir'} le mode admin (démo)</button></p>`}
function admV(){const us=S.u.length,ok=S.sb.filter(s=>s.st=='Validée'),dist=S.tx.filter(x=>x.amt>0&&x.type!='Bonus').reduce((a,x)=>a+x.amt,0),ret=S.wd.filter(w=>w.st=='Validé').reduce((a,w)=>a+w.a,0);
const prof=ok.reduce((a,s)=>{const m=S.m.find(x=>x.id==s.m);return a+((m.co||m.pay*1.5)-m.pay)},0);
return `<h2>${I('tool',22)} Admin (démo, sans authentification)</h2><div class="g2"><div class="card"><b>${us}</b><div class="m">Utilisateurs</div></div><div class="card"><b>${S.m.length}</b><div class="m">Missions créées</div></div><div class="card"><b>${ok.length}</b><div class="m">Missions validées</div></div><div class="card"><b>${fmt(dist)}</b><div class="m">Distribué</div></div><div class="card"><b>${fmt(ret)}</b><div class="m">Retraits validés</div></div><div class="card"><b>${fmt(prof)}</b><div class="m">Bénéfice admin</div></div></div>
<h3>Preuves à vérifier</h3>${S.sb.filter(s=>s.st=='En vérification').map(s=>{const m=S.m.find(x=>x.id==s.m),dup=S.sb.some(o=>o.id!=s.id&&o.u!=s.u&&o.img==s.img);return `<div class="card"><b>${esc(U(s.u).nm)}</b> · ${esc(m.t)} ${dup?'<span class="tag no">'+I('alert',13)+' Même image qu’un autre compte</span>':''}<br><img class="p" src="${s.img}" alt="preuve"><div class="row" style="margin-top:6px"><button data-a="val" data-p="${s.id}">Valider</button><button class="r" data-a="ref" data-p="${s.id}">Refuser</button><button class="s" data-a="blk" data-p="${s.u}">Bloquer</button></div></div>`}).join('')||'<p class="m">Aucune preuve en attente.</p>'}
<h3>Retraits en attente</h3>${S.wd.filter(w=>w.st=='En attente').map(w=>`<div class="card"><b>${esc(U(w.u).nm)}</b> · ${fmt(w.a,U(w.u))}<div class="m">${w.mt} · ${esc(w.n)} · ${w.d}${U(w.u).vip?' · '+I('star',13)+' prioritaire':''}</div><div class="row"><button data-a="wv" data-p="${w.id}">Valider</button><button class="r" data-a="wr" data-p="${w.id}">Refuser</button></div></div>`).join('')||'<p class="m">Aucun.</p>'}
<h3>Nouvelle mission</h3><div class="card"><input id="mt1" placeholder="Titre"><textarea id="md" placeholder="Description"></textarea><select id="mc"><option>Facile</option><option>Terrain</option><option>Vidéo</option><option>Sondage</option><option>Avis</option><option>Téléchargement</option></select><div class="g3"><input id="mp" type="number" placeholder="Paie user"><input id="me" type="number" placeholder="Paie entreprise"><input id="ms" type="number" placeholder="Places"></div><div class="m">Bénéfice = (entreprise − user) × places</div><button data-a="newm">Publier</button></div>
<h3>Missions</h3>${S.m.map(m=>`<div class="card row"><span>${esc(m.t)}</span><span><button class="s" data-a="pause" data-p="${m.id}">${m.off?'Reprendre':'Pause'}</button> <button class="r" data-a="del" data-p="${m.id}">${I('x',14)}</button></span></div>`).join('')}
<h3>Utilisateurs</h3><input id="q" placeholder="Rechercher nom ou téléphone" data-a="q">${S.u.filter(x=>(x.nm+x.ph).toLowerCase().includes(($('#q')||{value:''}).value.toLowerCase())).map(x=>`<div class="card row"><span>${esc(x.nm)}<br><span class="m">${x.ph} · ${C[x.c][0]} · ${fmt(x.bal,x)} · ${S.u.filter(y=>y.sp==x.id).length} filleuls</span></span><button class="${x.bl?'o':'r'}" data-a="blk" data-p="${x.id}">${x.bl?'Débloquer':'Bloquer'}</button></div>`).join('')}`}
const $=s=>document.querySelector(s),val=i=>($('#'+i)||{value:''}).value.trim();
function shrink(f,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,360/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.6))};i.src=r.result};r.readAsDataURL(f)}
function reward(s){const m=S.m.find(x=>x.id==s.m),u=U(s.u),a=pay(m,m.urg&&!m.vip);s.st='Validée';add(u,'Mission',a,'Validé');note(u.id,'Mission validée : +'+fmt(a,u));
chain(u).forEach((p,i)=>{const b=Math.round(a*[.1,.03,.01][i]);if(b){add(p,'Parrainage N'+(i+1),b,'Validé',u.id);note(p.id,'Parrainage gagné : +'+fmt(b,p))}})}
async function sync(au){let u=S.u.find(x=>x.em==au.email);if(!u){const m=au.user_metadata||{},p=S.u.find(x=>x.code==m.sponsor_code),id=S.n++;u={id,em:au.email,nm:m.full_name||au.email,ph:m.phone||'',c:m.country||'BJ',bal:0,vip:null,code:(m.full_name||'USER').split(' ')[0].toUpperCase().replace(/[^A-Z]/g,'').slice(0,5)+id+'3',sp:p&&p.id,d:today()};S.u.push(u);add(u,'Bonus',200,'Validé','Bienvenue');
chain(u).forEach((q,i)=>{const b=[500,100,50][i];add(q,'Parrainage N'+(i+1),b,'Validé',i?'':u.id);note(q.id,u.nm+' vient de s’inscrire : +'+fmt(b,q))})}
if(u.bl){await sb.auth.signOut();return alert('Compte bloqué.')}S.me=u.id;save();render()}
const A={home(){land=1;sms=null;render()},auth(p){land=0;mode=p;sms=null;render()},go(p){v=p;render()},mode(p){mode=p;render()},lang(p){S.lang=p;save();render()},
async signup(){const em=val('em').toLowerCase(),nm=val('nm'),pw=val('pw'),ph=val('ph').replace(/\s/g,'');if(!nm||!em.includes('@')||ph.length<8||pw.length<6)return alert('Remplis tous les champs (mot de passe : 6 caractères min.).');
const r=await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:nm,phone:ph,country:val('cy'),sponsor_code:val('sp').toUpperCase()}}});if(r.error)return alert(r.error.message);sms={email:em,type:'signup'};render()},
async verify(){const tk=val('cd');if(!tk)return alert('Entre le code reçu par email.');const r=await sb.auth.verifyOtp({email:sms.email,token:tk,type:sms.type});if(r.error)return alert('Code incorrect ou expiré.');
if(sms.type=='recovery'){if(val('pw').length<6)return alert('Mot de passe : 6 caractères min.');const x=await sb.auth.updateUser({password:val('pw')});if(x.error)return alert(x.error.message)}sms=null;await sync(r.data.user)},
async login(){const em=val('em').toLowerCase(),r=await sb.auth.signInWithPassword({email:em,password:val('pw')});
if(r.error){if(/confirm/i.test(r.error.message)){await sb.auth.resend({type:'signup',email:em});sms={email:em,type:'signup'};return render()}return alert('Email ou mot de passe incorrect.')}await sync(r.data.user)},
async forgot(){const em=val('em').toLowerCase();if(!em.includes('@'))return alert('Email invalide.');const r=await sb.auth.resetPasswordForEmail(em);if(r.error)return alert(r.error.message);sms={email:em,type:'recovery'};render()},
async resend(){const r=sms.type=='recovery'?await sb.auth.resetPasswordForEmail(sms.email):await sb.auth.resend({type:'signup',email:sms.email});alert(r.error?r.error.message:'Nouveau code envoyé.')},
cancel(){sms=null;mode='in';render()},
async out(){await sb.auth.signOut();S.me=null;adm=0;land=1;save();render()},open(p){pick=+p;v='mission';render();const f=$('#fl');if(f)f.onchange=()=>shrink(f.files[0],d=>{img=d;$('#pv').innerHTML='<img class="p" src="'+d+'" alt="aperçu">'})},
send(){if(!img)return alert('Ajoute ta preuve.');S.sb.push({id:S.n++,u:S.me,m:pick,st:'En vérification',img});img=null;note(S.me,'Preuve envoyée, en cours de vérification');save();render()},
copy(p){navigator.clipboard&&navigator.clipboard.writeText(p).then(()=>alert('Lien copié !'),()=>prompt('Copie ce lien',p))},
wd(){const u=me(),a=+val('am');if(a<1000)return alert('Minimum 1 000 FCFA.');if(a>u.bal)return alert('Solde insuffisant.');if(val('mn').length<8)return alert('Numéro invalide.');const id=S.n++;S.wd.push({id,u:u.id,a,mt:val('mt'),n:val('mn'),st:'En attente',d:today()});add(u,'Retrait',-a,'En attente',id);save();alert('Retrait demandé. Tu reçois ton argent sur MoMo en 24h maximum.');render()},
vip(){const u=me();if(u.bal<1000)return alert('Solde insuffisant.');add(u,'Bonus',-1000,'Validé','VIP');const d=new Date(Math.max(Date.now(),u.vip?new Date(u.vip):0)+30*864e5);u.vip=d.toISOString().slice(0,10);save();render()},
saveme(){const u=me();u.nm=val('nm')||u.nm;u.ph=val('ph')||u.ph;u.c=val('cy');u.nf=$('#nf').checked?1:0;S.lang=val('lg');save();render()},
adm(){adm=!adm;v=adm?'admin':'me';render()},val(p){const s=S.sb.find(x=>x.id==p);reward(s);save();render()},ref(p){const s=S.sb.find(x=>x.id==p);s.st='Refusée';s.rs=prompt('Motif du refus ?')||'Preuve non conforme';save();render()},
blk(p){const u=U(p);u.bl=!u.bl;save();render()},wv(p){const w=S.wd.find(x=>x.id==p);w.st='Validé';S.tx.filter(x=>x.note==p&&x.type=='Retrait').forEach(x=>x.st='Validé');note(w.u,'Retrait validé');save();render()},
wr(p){const w=S.wd.find(x=>x.id==p);w.st='Refusé';S.tx.filter(x=>x.note==p&&x.type=='Retrait').forEach(x=>x.st='Refusé');add(U(w.u),'Bonus',w.a,'Validé','Remboursement');save();render()},
newm(){const p=+val('mp');if(!val('mt1')||!p)return alert('Titre et paie requis.');S.m.push({id:S.n++,t:val('mt1'),d:val('md'),cat:val('mc'),pay:p,co:+val('me')||p*1.5,min:5,sl:+val('ms')||50,pr:'Capture d’écran',st:['Lis la description','Réalise la tâche','Envoie ta preuve']});save();render()},
pause(p){const m=S.m.find(x=>x.id==p);m.off=!m.off;save();render()},del(p){S.m=S.m.filter(x=>x.id!=p);save();render()},q(){}};
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a&&a.tagName!='INPUT'&&A[a.dataset.a])A[a.dataset.a](a.dataset.p)});
document.addEventListener('input',e=>{if(e.target.id=='q'){const s=e.target.selectionStart,w=e.target.value;render();const q=$('#q');q.value=w;q.focus();q.setSelectionRange(s,s)}});
S.me=null;sb.auth.getSession().then(({data})=>data.session?sync(data.session.user):render()).catch(render);
